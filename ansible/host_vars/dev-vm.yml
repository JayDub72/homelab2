---
# Configuration for dev-vm

# Load vault variables
- include_vars: dev-vm-vault.yml

# Common configuration
configure_common: true
install_docker: false

# User configuration
additional_user:
  username: "jason"
  comment: "Jason Worthen"
  password: "{{ vault_additional_user_password }}"
  groups:
    - sudo
    - docker
  ssh_key: "{{ vault_additional_user_ssh_key }}"

# Root password (from vault)
root_password: "{{ vault_root_password }}"

# Managed directories for development
managed_directories:
  - path: "/opt/projects"
    owner: "developer"
    group: "developer"
    mode: "0755"

  - path: "/data/dev"
    owner: "developer"
    group: "developer"
    mode: "0775"
    subdirs:
      - repos
      - builds
      - logs

# CIFS/SMB mounts for media
cifs_shares:
  - name: "media"
    share_path: "//192.168.1.210/data"
    mount_point: "/mnt/media"
    username: "{{ vault_cifs_username }}"
    password: "{{ vault_cifs_password }}"
    mount_owner: "1000"
    mount_group: "1000"
    mount_mode: "0755"
    state: "mounted"
