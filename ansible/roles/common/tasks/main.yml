---
# Common role - Ubuntu system configuration
- name: Set timezone
  community.general.timezone:
    name: "{{ system_timezone }}"
  tags: [timezone]

- name: Update apt cache
  apt:
    update_cache: yes
    cache_valid_time: 3600
  tags: [packages]

- name: Upgrade all packages
  apt:
    upgrade: dist
    autoremove: yes
    autoclean: yes
  when: system_upgrade_packages | default(true)
  tags: [packages, upgrade]

- name: Install common packages
  apt:
    name: "{{ common_packages }}"
    state: present
  tags: [packages]

# User Management
- name: Check if additional user exists
  getent:
    database: passwd
    key: "{{ additional_user.username }}"
  register: user_exists
  failed_when: false
  when: 
    - additional_user is defined
    - additional_user.username is defined
  tags: [users]

- name: Create or update additional user account
  user:
    name: "{{ additional_user.username }}"
    comment: "{{ additional_user.comment | default('') }}"
    shell: /bin/bash
    groups: "{{ additional_user.groups | default(['sudo']) }}"
    append: no  # Replace groups to ensure consistency
    create_home: yes
    state: present
  when: 
    - additional_user is defined
    - additional_user.username is defined
  tags: [users]

- name: Force update password for additional user (even if exists)
  user:
    name: "{{ additional_user.username }}"
    password: "{{ additional_user.password | password_hash('sha512') }}"
    update_password: always  # Always update password
  when:
    - additional_user is defined
    - additional_user.username is defined
    - additional_user.password is defined
  no_log: true
  tags: [users]

- name: Ensure .ssh directory exists for additional user
  file:
    path: "/home/{{ additional_user.username }}/.ssh"
    state: directory
    mode: '0700'
    owner: "{{ additional_user.username }}"
    group: "{{ additional_user.username }}"
  when:
    - additional_user is defined
    - additional_user.username is defined
  tags: [users, ssh]

- name: Add SSH key for additional user
  authorized_key:
    user: "{{ additional_user.username }}"
    key: "{{ additional_user.ssh_key }}"
    state: present
    exclusive: no
  when:
    - additional_user is defined
    - additional_user.username is defined
    - additional_user.ssh_key is defined
  tags: [users, ssh]

- name: Configure passwordless sudo for sudo group
  lineinfile:
    path: /etc/sudoers.d/sudo-group-nopasswd
    line: '%sudo ALL=(ALL:ALL) NOPASSWD: ALL'
    create: yes
    mode: '0440'
    validate: 'visudo -cf %s'
  when: allow_passwordless_sudo | default(true)
  tags: [sudo]

- name: Set root password
  user:
    name: root
    password: "{{ root_password | password_hash('sha512') }}"
    update_password: always
  when: root_password is defined
  no_log: true
  tags: [users, security]

# SSH Security Configuration
- name: Configure SSH - Disable root login
  lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?PermitRootLogin'
    line: 'PermitRootLogin no'
    state: present
  notify: Restart SSH
  when: disable_root_ssh | default(true)
  tags: [ssh, security]

- name: Configure SSH - Enable pubkey authentication
  lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?PubkeyAuthentication'
    line: 'PubkeyAuthentication yes'
    state: present
  notify: Restart SSH
  tags: [ssh, security]

- name: Configure SSH - Disable password authentication
  lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?PasswordAuthentication'
    line: 'PasswordAuthentication {{ "yes" if allow_password_auth | default(false) else "no" }}'
    state: present
  notify: Restart SSH
  tags: [ssh, security]

- name: Ensure additional user can SSH
  blockinfile:
    path: /etc/ssh/sshd_config
    marker: "# {mark} ANSIBLE MANAGED - Allow specific users"
    block: |
      AllowUsers {{ additional_user.username }} 
    insertafter: EOF
    create: no
  when:
    - additional_user is defined
    - additional_user.username is defined
    - restrict_ssh_users | default(true)
  notify: Restart SSH
  tags: [ssh, security]

- name: Enable UFW firewall
  community.general.ufw:
    state: enabled
    policy: deny
  when: enable_ufw | default(false)
  tags: [firewall]

- name: Allow SSH through UFW
  community.general.ufw:
    rule: allow
    port: '22'
    proto: tcp
  when: enable_ufw | default(false)
  tags: [firewall]