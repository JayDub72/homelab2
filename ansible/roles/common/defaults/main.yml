---
# Default variables for common role
system_timezone: "America/Chicago"
system_upgrade_packages: true
allow_passwordless_sudo: true
disable_root_ssh: true
enable_ufw: false
allow_password_auth: false  # Disable password auth, SSH key only
restrict_ssh_users: true    # Only allow specific users

common_packages:
  - vim
  - curl
  - wget
  - git
  - htop
  - net-tools
  - unzip
  - software-properties-common
  - apt-transport-https
  - ca-certificates
  - gnupg
  - lsb-release

# Example additional user configuration
# Override in host_vars or group_vars
# IMPORTANT: Use Ansible Vault to encrypt these values!
# additional_user:
#   username: "myuser"
#   comment: "My User Account"
#   password: "changeme"      # ENCRYPT WITH VAULT!
#   groups:
#     - sudo
#   ssh_key: "ssh-rsa AAAAB3..."  # ENCRYPT WITH VAULT!

# root_password: "newrootpassword"  # ENCRYPT WITH VAULT!